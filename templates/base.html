<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}LoanTracker{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% if theme == 'dark' %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dark.css') }}">
  {% endif %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="{% if theme == 'dark' %}theme-dark{% endif %}">
<div class="app-shell">
  <aside class="app-sidebar">
    <div class="app-brand">
      <div class="brand-icon"><i class="bi bi-cash-stack"></i></div>
      <div class="brand-name">LoanTracker</div>
    </div>

    <nav class="app-nav">
      <a class="app-nav-link {% if request.endpoint == 'dashboard' %}is-active{% endif %}" href="{{ url_for('dashboard') }}">
        <i class="bi bi-grid"></i><span>Dashboard</span>
      </a>
      <a class="app-nav-link {% if request.endpoint == 'people' %}is-active{% endif %}" href="{{ url_for('people') }}">
        <i class="bi bi-people"></i><span>People</span>
      </a>
      <a class="app-nav-link {% if request.endpoint == 'loans' %}is-active{% endif %}" href="{{ url_for('loans') }}">
        <i class="bi bi-receipt"></i><span>Loans</span>
      </a>
      <a class="app-nav-link {% if request.endpoint == 'reports' %}is-active{% endif %}" href="{{ url_for('reports') }}">
        <i class="bi bi-bar-chart"></i><span>Reports</span>
      </a>
      <a class="app-nav-link {% if request.endpoint == 'settings' %}is-active{% endif %}" href="{{ url_for('settings') }}">
        <i class="bi bi-gear"></i><span>Settings</span>
      </a>
    </nav>
  </aside>

  <div class="app-main">
    <header class="app-topbar">
      <button class="btn btn-topbar-icon d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileNav">
        <i class="bi bi-layout-sidebar"></i>
      </button>



      <div class="topbar-actions">
        <a class="btn btn-topbar-icon" href="{{ url_for('settings') }}" aria-label="Settings">
          <i class="bi bi-gear"></i>
        </a>
      </div>
    </header>

    <main class="app-content">
      {% block content %}{% endblock %}
    </main>
  </div>
</div>

<div class="offcanvas offcanvas-start" tabindex="-1" id="mobileNav">
  <div class="offcanvas-header">
    <div class="d-flex align-items-center gap-2">
      <div class="brand-icon"><i class="bi bi-cash-stack"></i></div>
      <div class="fw-semibold">LoanTracker</div>
    </div>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
  </div>
  <div class="offcanvas-body">
    <div class="d-grid gap-1">
      <a class="app-nav-link {% if request.endpoint == 'dashboard' %}is-active{% endif %}" href="{{ url_for('dashboard') }}">Dashboard</a>
      <a class="app-nav-link {% if request.endpoint == 'people' %}is-active{% endif %}" href="{{ url_for('people') }}">People</a>
      <a class="app-nav-link {% if request.endpoint == 'loans' %}is-active{% endif %}" href="{{ url_for('loans') }}">Loans</a>
      <a class="app-nav-link {% if request.endpoint == 'reports' %}is-active{% endif %}" href="{{ url_for('reports') }}">Reports</a>
      <a class="app-nav-link {% if request.endpoint == 'settings' %}is-active{% endif %}" href="{{ url_for('settings') }}">Settings</a>
    </div>
  </div>
</div>

</body>
</html>
